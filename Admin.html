<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --primary: #0f172a;
      --accent: #1a8c7a;
      --bg: #f8fafc;
      --text: #334155;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
      --warn: #d97706;
      --ok: #15803d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      line-height: 1.5;
      padding: 20px;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.1);
      padding: 28px;
    }

    h1 {
      color: var(--primary);
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .hint {
      color: var(--muted);
      margin-bottom: 22px;
      font-size: 0.95rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
      font-size: 1rem;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #ffffff;
      cursor: pointer;
      font-weight: 700;
      padding: 13px 18px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin: 18px 0;
    }

    .metric {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #f8fafc;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      color: var(--primary);
      margin-top: 4px;
      word-break: break-word;
    }

    .status-ok { color: var(--ok); }
    .status-bad { color: var(--danger); }

    .message {
      border-radius: 12px;
      margin-top: 14px;
      padding: 12px;
      background: #fee2e2;
      color: #991b1b;
      font-weight: 700;
    }

    table {
      border-collapse: collapse;
      margin-top: 16px;
      width: 100%;
    }

    th, td {
      border-bottom: 1px solid var(--border);
      padding: 10px 8px;
      text-align: left;
      vertical-align: top;
      font-size: 0.9rem;
    }

    th {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .critical { color: var(--danger); font-weight: 700; }
    .warning { color: var(--warn); font-weight: 700; }
    .info { color: var(--muted); font-weight: 700; }

    .back-link {
      display: inline-block;
      color: var(--muted);
      font-weight: 700;
      margin-top: 22px;
      text-decoration: none;
    }

    .back-link:hover { color: var(--accent); }

    @media (max-width: 760px) {
      main { padding: 20px; }
      .form-row { grid-template-columns: 1fr; }
      .summary { grid-template-columns: 1fr 1fr; }
      table { display: block; overflow-x: auto; }
    }
      .nomination-actions { margin: 0 0 20px; }
    .nomination-actions button { background: var(--accent); }
    .nomination-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }
    .nomination-card summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--primary);
    }
    .nomination-meta { color: var(--muted); margin-top: 8px; font-size: 0.85rem; }
    .nomination-table { overflow-x: auto; }
    .tie-label { color: var(--warn); font-weight: 700; }
    .nomination-notice {
      background: #fffbeb;
      color: #92400e;
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
    }
      /* Carta pencalonan */
    .nomination-chart {
      margin: 20px 0;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #f8fafc;
    }
    .nomination-chart figcaption {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .chart-note {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 18px;
    }
    .chart-row {
      display: grid;
      grid-template-columns: minmax(0, 45%) minmax(0, 1fr) 42px;
      gap: 12px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .chart-row:last-child { border-bottom: 0; }
    .chart-name {
      font-size: 0.85rem;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .chart-tie {
      display: inline-block;
      margin-left: 6px;
      color: #92400e;
      background: #fef3c7;
      border-radius: 5px;
      padding: 1px 5px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .chart-track {
      height: 22px;
      background: #e2e8f0;
      border-radius: 5px;
      overflow: hidden;
    }
    .chart-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 5px;
    }
    .chart-count {
      text-align: right;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }
    @media (max-width: 600px) {
      .nomination-chart { padding: 12px; }
      .chart-row { grid-template-columns: minmax(0, 1fr) 42px; gap: 7px 10px; }
      .chart-name { grid-column: 1 / -1; }
    }
      .ajk-panel {
      margin: 20px 0;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #f8fafc;
    }
    .ajk-panel[hidden] { display: none; }
    .ajk-panel h2 { color: var(--primary); margin-bottom: 8px; }
    .ajk-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
    .ajk-toolbar label { flex: 1; min-width: 180px; }
    .ajk-panel label { display: block; font-weight: 600; font-size: 0.9rem; }
    .ajk-panel input, .ajk-panel textarea {
      margin-top: 5px;
      font-family: inherit;
      font-size: 0.95rem;
    }
    .ajk-panel textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 12px;
      min-height: 80px;
      resize: vertical;
    }
    .ajk-member {
      margin: 16px 0;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
    }
    .ajk-member legend { color: var(--primary); font-weight: 700; padding: 0 6px; }
    .ajk-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .ajk-wide { grid-column: 1 / -1; }
    .ajk-confirm { margin-top: 16px; }
    .ajk-confirm input { width: auto; margin-right: 8px; }
    .ajk-publish { background: var(--accent); }
    .ajk-success { background: #dcfce7; color: #166534; }
    @media (max-width: 600px) {
      .ajk-fields { grid-template-columns: 1fr; }
      .ajk-panel { padding: 12px; }
    }
      /* Paparan pencalonan graf sahaja */
    #nominationResult .nomination-card > .nomination-table {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Dashboard Admin LAPPS DVS</h1>
    <p class="hint">Masukkan PIN admin untuk melihat analisis pencalonan atau menyemak data keahlian.</p>

    <div class="form-row">
      <input type="password" id="pinInput" placeholder="Admin PIN" autocomplete="current-password">
      <button id="runBtn" onclick="runHealthCheck()">Run Health Check</button>
    </div>

    <div class="nomination-actions">
      <button id="nominationBtn" type="button" onclick="runNominationAnalysis()">
        Analisis Pencalonan
      </button>
    </div>
        <div class="nomination-actions">
      <button id="ajkOpenBtn" type="button" onclick="toggleAjkPanel()">
        Urus AJK Sesi Baharu
      </button>
    </div>
    <section id="ajkPanel" class="ajk-panel" hidden>
      <h2>Urus AJK Sesi Baharu</h2>
      <p class="nomination-meta">Isi barisan yang disahkan urusetia selepas AGM.
        Draf tidak dipaparkan kepada ahli.</p>
      <div class="ajk-toolbar">
        <label>Sesi
          <input id="ajkSession" value="2026/2028" maxlength="9">
        </label>
        <button id="ajkLoadBtn" type="button" onclick="loadAjkSession()">
          Muatkan Sesi
        </button>
      </div>
      <div id="ajkMessage" aria-live="polite"></div>
      <div id="ajkEditor" hidden>
        <p id="ajkStatus" class="nomination-meta"></p>
        <div id="ajkMembers"></div>
        <h3>Pratonton Barisan AJK</h3>
        <div id="ajkPreview" class="nomination-table"></div>
        <label class="ajk-confirm">
          <input id="ajkConfirmed" type="checkbox">
          Saya mengesahkan nama dan jawatan ini berdasarkan keputusan rasmi AGM.
        </label>
        <div class="ajk-toolbar">
          <button id="ajkSaveBtn" type="button" onclick="saveAjkSession(false)">
            Simpan Draf
          </button>
          <button id="ajkPublishBtn" class="ajk-publish" type="button"
                  onclick="saveAjkSession(true)">
            Terbitkan Barisan AJK
          </button>
        </div>
      </div>
    </section>
    <div id="nominationResult" aria-live="polite"></div>
    <div id="result"></div>

    <a href="https://lappsdvs.github.io/lapps/" class="back-link">← Kembali ke Halaman Utama</a>
  </main>

  <script>
    document.getElementById('pinInput').addEventListener('keypress', function(event) {
      if (event.key === 'Enter') runHealthCheck();
    });

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function runHealthCheck() {
      const pin = document.getElementById('pinInput').value;
      const resultDiv = document.getElementById('result');
      const runBtn = document.getElementById('runBtn');

      runBtn.disabled = true;
      resultDiv.innerHTML = '<p class="hint">Running health check...</p>';

      adminApi()
        .withSuccessHandler(function(report) {
          runBtn.disabled = false;
          renderReport(report);
        })
        .withFailureHandler(function(error) {
          runBtn.disabled = false;
          resultDiv.innerHTML = '<div class="message">Sistem ralat: ' + escapeHtml(error.message) + '</div>';
        })
        .runAdminHealthCheck(pin);
    }

    function renderReport(report) {
      const resultDiv = document.getElementById('result');

      if (!report || report.error) {
        resultDiv.innerHTML = '<div class="message">' + escapeHtml(report && report.error ? report.error : 'No report returned') + '</div>';
        return;
      }

      const issues = Array.isArray(report.issues) ? report.issues.slice(0, 20) : [];
      const rows = issues.map(issue => {
        const severity = escapeHtml(issue.severity || 'info');
        return `
          <tr>
            <td>${escapeHtml(issue.row || '')}</td>
            <td>${escapeHtml(issue.column || '')}</td>
            <td>${escapeHtml(issue.noAhli || '')}</td>
            <td>${escapeHtml(issue.memberName || '')}</td>
            <td>${escapeHtml(issue.type || '')}</td>
            <td class="${severity}">${severity}</td>
            <td>${escapeHtml(issue.message || '')}</td>
          </tr>`;
      }).join('');

      resultDiv.innerHTML = `
        <div class="summary">
          <div class="metric"><span>OK</span><strong class="${report.ok ? 'status-ok' : 'status-bad'}">${escapeHtml(report.ok)}</strong></div>
          <div class="metric"><span>Spreadsheet</span><strong>${escapeHtml(report.spreadsheetName)}</strong></div>
          <div class="metric"><span>Sheet</span><strong>${escapeHtml(report.sheetName)}</strong></div>
          <div class="metric"><span>Total Rows</span><strong>${escapeHtml(report.totalRows)}</strong></div>
          <div class="metric"><span>Total Issues</span><strong>${escapeHtml(report.totalIssues)}</strong></div>
        </div>
        <table>
          <thead>
            <tr>
              <th>Row</th>
              <th>Column</th>
              <th>No Ahli</th>
              <th>Nama Ahli</th>
              <th>Type</th>
              <th>Severity</th>
              <th>Message</th>
            </tr>
          </thead>
          <tbody>${rows || '<tr><td colspan="7">No issues in first 20 results.</td></tr>'}</tbody>
        </table>`;
    }
      document.getElementById('pinInput').addEventListener('input', function() {
      document.getElementById('nominationResult').innerHTML = '';
      document.getElementById('result').innerHTML = '';
    });

    function runNominationAnalysis() {
      const pinInput = document.getElementById('pinInput');
      const pin = pinInput.value;
      const target = document.getElementById('nominationResult');
      const button = document.getElementById('nominationBtn');

      target.innerHTML = '';
      if (!pin) {
        target.innerHTML = '<div class="message">Masukkan PIN admin dahulu.</div>';
        pinInput.focus();
        return;
      }

      button.disabled = true;
      pinInput.disabled = true;
      target.innerHTML = '<p class="hint">Sedang membaca dan mengira pencalonan...</p>';

      adminApi()
        .withSuccessHandler(function(report) {
          button.disabled = false;
          pinInput.disabled = false;
          renderNominationAnalysis(report);
        })
        .withFailureHandler(function(error) {
          button.disabled = false;
          pinInput.disabled = false;
          target.innerHTML = '<div class="message">Sistem ralat: ' +
            escapeHtml(error.message) + '</div>';
        })
        .runAdminNominationAnalysis(pin);
    }

    function renderNominationAnalysis(report) {
      const target = document.getElementById('nominationResult');
      if (!report || !report.ok) {
        target.innerHTML = '<div class="message">' +
          escapeHtml(report && report.error ? report.error : 'Tiada laporan diterima.') +
          '</div>';
        return;
      }

      const checkedAt = new Date(report.checkedAt).toLocaleString('en-GB', {
        timeZone: 'Asia/Kuala_Lumpur',
        dateStyle: 'medium',
        timeStyle: 'short'
      });

      const duplicateRows = report.duplicateMjkRows || [];
      const duplicateNotice = duplicateRows.length
        ? '<div class="nomination-notice">Nama MJK berulang dalam response sama pada baris sheet: ' +
          escapeHtml(duplicateRows.join(', ')) +
          '. Kiraan masih memasukkan setiap ruangan; semak sebelum keputusan dimuktamadkan.</div>'
        : '';

      const cards = (report.rankings || []).map(function(group) {
        const rows = (group.candidates || []).map(function(candidate) {
          const variants = candidate.spellings || [];
          const variantNote = variants.length > 1
            ? '<details class="nomination-meta"><summary>Variasi tulisan asal</summary>' +
              variants.map(escapeHtml).join('<br>') + '</details>'
            : '';

          return '<tr>' +
            '<td>' + escapeHtml(candidate.rank) + '</td>' +
            '<td>' + escapeHtml(candidate.name) + variantNote + '</td>' +
            '<td><strong>' + escapeHtml(candidate.count) + '</strong></td>' +
            '<td>' + (candidate.tied ? '<span class="tie-label">SERI</span>' : '') + '</td>' +
            '</tr>';
        }).join('');

        return '<details class="nomination-card" open>' +
          '<summary>' + escapeHtml(group.role) + '</summary>' +
          '<p class="nomination-meta">' +
          escapeHtml(group.totalCandidates) + ' calon · ' +
          escapeHtml(group.totalNominations) + ' pencalonan · ' +
          escapeHtml(group.emptySlots) + ' ruangan kosong</p>' +
          renderNominationChart(group) +
          '<div class="nomination-table"><table>' +
          '<thead><tr><th>Kedudukan</th><th>Nama calon</th>' +
          '<th>Jumlah pencalonan</th><th>Catatan</th></tr></thead>' +
          '<tbody>' + (rows || '<tr><td colspan="4">Belum ada pencalonan.</td></tr>') +
          '</tbody></table></div></details>';
      }).join('');

      target.innerHTML =
        '<h2>Analisis Pencalonan Semasa</h2>' +
        '<p class="nomination-meta">Belum disahkan — bukan keputusan pengundian.</p>' +
        '<p><strong>Jumlah responses: ' + escapeHtml(report.totalResponses) + '</strong></p>' +
        '<p class="nomination-meta">Dikemas kini: ' + escapeHtml(checkedAt) +
        ' (waktu Malaysia)</p>' +
        '<p class="nomination-notice">' + escapeHtml(report.note) + '</p>' +
        duplicateNotice + cards;
    }
      function adminApi() {
      let successHandler = function() {};
      let failureHandler = function() {};

      async function send(action, pin) {
        const controller = new AbortController();
        const timeout = setTimeout(function() {
          controller.abort();
        }, 30000);

        let report;
        try {
          const response = await fetch(
            'https://script.google.com/macros/s/AKfycbwF-x9eezUErBoAL73rqp8k9tMgdISMXwk0wBOGtRfiG15jhAUiNbyJ6Kd8jyoUQgzpHw/exec',
            {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
              body: JSON.stringify({ action: action, pin: pin }),
              credentials: 'omit',
              redirect: 'follow',
              signal: controller.signal
            }
          );

          if (!response.ok) {
            throw new Error('Backend memberikan HTTP ' + response.status + '.');
          }

          const text = await response.text();
          try {
            report = JSON.parse(text);
          } catch (error) {
            throw new Error('Backend tidak memberikan JSON. Semak deployment web app.');
          }
        } catch (error) {
          clearTimeout(timeout);
          failureHandler({
            message: error.name === 'AbortError'
              ? 'Permintaan melebihi 30 saat. Cuba semula.'
              : error.message
          });
          return;
        }

        clearTimeout(timeout);
        successHandler(report);
      }

      const api = {
        withSuccessHandler: function(handler) {
          successHandler = handler;
          return api;
        },
        withFailureHandler: function(handler) {
          failureHandler = handler;
          return api;
        },
        runAdminHealthCheck: function(pin) {
          return send('healthCheck', pin);
        },
        runAdminNominationAnalysis: function(pin) {
          return send('nominationAnalysis', pin);
        }
      };

      return api;
    }
      function renderNominationChart(group) {
      const candidates = Array.isArray(group.candidates) ? group.candidates : [];
      if (!candidates.length) {
        return '<p class="nomination-meta">Belum ada data untuk carta.</p>';
      }

      const getCount = function(candidate) {
        const value = Number(candidate.count);
        return Number.isFinite(value) && value > 0 ? value : 0;
      };
      const maximum = Math.max(1, ...candidates.map(getCount));

      const bars = candidates.map(function(candidate) {
        const count = getCount(candidate);
        const width = Math.min(100, count / maximum * 100).toFixed(2);

        return '<div class="chart-row">' +
          '<div class="chart-name">' + escapeHtml(candidate.name) +
          (candidate.tied ? '<span class="chart-tie">SERI</span>' : '') +
          '</div>' +
          '<div class="chart-track" aria-hidden="true">' +
          '<div class="chart-fill" style="width:' + width + '%"></div></div>' +
          '<div class="chart-count"><span aria-label="' +
          escapeHtml(count + ' pencalonan') + '">' + escapeHtml(count) +
          '</span></div></div>';
      }).join('');

      return '<figure class="nomination-chart">' +
        '<figcaption>Carta Jumlah Pencalonan</figcaption>' +
        '<p class="chart-note">Skala bermula dari 0 hingga ' +
        escapeHtml(maximum) + ' pencalonan untuk jawatan ini. ' +
        'Panjang bar menunjukkan jumlah pencalonan, bukan peratus undi.</p>' +
        bars + '</figure>';
    }
      let ajkState = null;
    let ajkSuggestions = {};
    let ajkWorking = false;

    const ajkLabels = {
      YDP: 'Yang Dipertua', NYDP: 'Naib Yang Dipertua',
      SU: 'Setiausaha', NSU: 'Naib Setiausaha', BENDAHARI: 'Bendahari',
      MJK1: 'Ahli MJK 1', MJK2: 'Ahli MJK 2', MJK3: 'Ahli MJK 3',
      MJK4: 'Ahli MJK 4', MJK5: 'Ahli MJK 5', MJK6: 'Ahli MJK 6'
    };

    function toggleAjkPanel() {
      const panel = document.getElementById('ajkPanel');
      panel.hidden = !panel.hidden;
    }

    function ajkMessage(text, success) {
      const target = document.getElementById('ajkMessage');
      target.className = 'message' + (success ? ' ajk-success' : '');
      target.textContent = text;
    }

    function ajkBusy(busy) {
      ajkWorking = busy;
      document.querySelectorAll(
        '#ajkPanel input, #ajkPanel textarea, #ajkPanel button, ' +
        '#pinInput, #runBtn, #nominationBtn, #ajkOpenBtn'
      ).forEach(function(element) { element.disabled = busy; });
    }

    async function ajkRequest(action, extra) {
      const pin = document.getElementById('pinInput').value;
      if (!pin) throw new Error('Masukkan PIN admin dahulu.');

      const controller = new AbortController();
      const timeout = setTimeout(function() { controller.abort(); }, 30000);
      try {
        const response = await fetch(
          'https://script.google.com/macros/s/AKfycbwF-x9eezUErBoAL73rqp8k9tMgdISMXwk0wBOGtRfiG15jhAUiNbyJ6Kd8jyoUQgzpHw/exec',
          {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
            body: JSON.stringify(Object.assign({}, extra, { action: action, pin: pin })),
            credentials: 'omit',
            redirect: 'follow',
            signal: controller.signal
          }
        );
        if (!response.ok) throw new Error('Backend memberikan HTTP ' + response.status + '.');
        const report = await response.json();
        if (!report || !report.ok) {
          throw new Error(report && report.error ? report.error : 'Tiada laporan diterima.');
        }
        return report;
      } catch (error) {
        if (error.name === 'AbortError') {
          throw new Error('Permintaan tamat masa. Muatkan semula sesi untuk semak rekod sebelum mencuba lagi.');
        }
        throw error;
      } finally {
        clearTimeout(timeout);
      }
    }

    async function loadAjkSession() {
      if (ajkWorking) return;
      if (ajkState && !confirm('Muatkan semula sesi? Perubahan yang belum disimpan akan digantikan.')) return;
      const sesi = document.getElementById('ajkSession').value.trim();
      ajkBusy(true);
      ajkMessage('Sedang memuatkan sesi...');
      try {
        const report = await ajkRequest('getAjk', { sesi: sesi });
        ajkState = {
          sesi: report.sesi,
          version: report.record ? report.record.version : 0,
          roles: report.roles,
          published: report.published
        };
        renderAjkEditor(report);
        ajkMessage('Sesi dimuatkan. Pilih calon atau isi nama secara manual.', true);
      } catch (error) {
        ajkState = null;
        document.getElementById('ajkEditor').hidden = true;
        ajkMessage(error.message);
      } finally {
        ajkBusy(false);
      }
    }

    function renderAjkEditor(report) {
      const existing = report.record ? report.record.members : [];
      const groups = report.candidateGroups || [];
      ajkSuggestions = {};

      const fields = report.roles.map(function(role, index) {
        const member = existing.find(function(item) { return item.role === role; }) || {};
        const group = groups[index < 5 ? index : 5] || {};
        const options = new Map();

        (group.candidates || []).forEach(function(candidate) {
          const parts = String(candidate.name).split(/\s+-\s+/);
          const nama = parts[0].trim();
          const organisasi = parts.length >= 3 ? parts.slice(2).join(' - ') : '';
          if (!options.has(nama)) options.set(nama, organisasi);
        });
        ajkSuggestions[role] = options;

        const list = Array.from(options.keys()).map(function(nama) {
          return '<option value="' + escapeHtml(nama) + '"></option>';
        }).join('');

        return '<fieldset class="ajk-member"><legend>' +
          escapeHtml(ajkLabels[role] || role) + '</legend><div class="ajk-fields">' +
          '<label class="ajk-wide">Nama calon' +
          '<input id="ajk_' + role + '_nama" list="ajkList_' + role +
          '" maxlength="200" value="' + escapeHtml(member.nama || '') + '">' +
          '<datalist id="ajkList_' + role + '">' + list + '</datalist></label>' +
          '<label>Organisasi' +
          '<input id="ajk_' + role + '_organisasi" maxlength="200" value="' +
          escapeHtml(member.organisasi || '') + '"></label>' +
          '<label>Jumlah undi sah (pilihan)' +
          '<input id="ajk_' + role + '_undi" type="number" min="0" step="1" value="' +
          escapeHtml(member.undi == null ? '' : member.undi) + '"></label>' +
          '<label class="ajk-wide">URL gambar HTTPS (pilihan)' +
          '<input id="ajk_' + role + '_foto" type="url" maxlength="1000" value="' +
          escapeHtml(member.foto || '') + '"></label>' +
          '<label class="ajk-wide">Profil ringkas (pilihan)' +
          '<textarea id="ajk_' + role + '_profil" maxlength="500">' +
          escapeHtml(member.profil || '') + '</textarea></label>' +
          '</div></fieldset>';
      }).join('');

      document.getElementById('ajkMembers').innerHTML = fields;

      report.roles.forEach(function(role) {
        document.getElementById('ajk_' + role + '_nama')
          .addEventListener('change', function() {
            const nama = this.value.trim();
            const organisation = ajkSuggestions[role].get(nama);
            if (organisation !== undefined) {
              document.getElementById('ajk_' + role + '_organisasi').value = organisation;
            }
            document.getElementById('ajkConfirmed').checked = false;
            previewAjk();
          });
      });

      document.getElementById('ajkConfirmed').checked = false;
      document.getElementById('ajkEditor').hidden = false;
      updateAjkStatus(report.record);
      previewAjk();
    }

    function collectAjkMembers() {
      return ajkState.roles.map(function(role) {
        function value(field) {
          return document.getElementById('ajk_' + role + '_' + field).value.trim();
        }
        const undi = value('undi');
        return {
          role: role, nama: value('nama'), organisasi: value('organisasi'),
          undi: undi === '' ? null : Number(undi),
          foto: value('foto'), profil: value('profil')
        };
      });
    }

    function previewAjk() {
      if (!ajkState) return;
      const rows = collectAjkMembers().map(function(member) {
        return '<tr><td>' + escapeHtml(ajkLabels[member.role]) +
          '</td><td>' + escapeHtml(member.nama || 'Belum diisi') +
          '</td><td>' + escapeHtml(member.organisasi || '') + '</td></tr>';
      }).join('');
      document.getElementById('ajkPreview').innerHTML =
        '<table><thead><tr><th>Jawatan</th><th>Nama</th><th>Organisasi</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>';
    }

    function updateAjkStatus(record) {
      const published = ajkState.published;
      document.getElementById('ajkStatus').textContent =
        'Sesi ' + ajkState.sesi + ' | ' +
        (record ? record.status + ' | Versi ' + record.version : 'Belum disimpan') +
        (published ? ' | Ada barisan diterbitkan bagi sesi ini.' : ' | Belum diterbitkan.');
    }

    async function saveAjkSession(publish) {
      if (ajkWorking) return;
      if (!ajkState) { ajkMessage('Muatkan sesi dahulu.'); return; }
      if (document.getElementById('ajkSession').value.trim() !== ajkState.sesi) {
        ajkMessage('Sesi berubah. Klik Muatkan Sesi dahulu.');
        return;
      }

      const members = collectAjkMembers();
      const seen = new Set();
      for (const member of members) {
        if (member.undi !== null &&
            (!Number.isSafeInteger(member.undi) || member.undi < 0)) {
          ajkMessage('Semak jumlah undi bagi ' + ajkLabels[member.role] + '.');
          return;
        }
        if (member.nama) {
          const key = member.nama.replace(/\s+/g, ' ').toUpperCase();
          if (seen.has(key)) { ajkMessage('Nama berulang: ' + member.nama); return; }
          seen.add(key);
        }
        if (publish && (!member.nama || !member.organisasi)) {
          ajkMessage('Lengkapkan nama dan organisasi bagi ' + ajkLabels[member.role] + '.');
          return;
        }
      }

      if (publish) {
        previewAjk();
        if (!document.getElementById('ajkConfirmed').checked) {
          ajkMessage('Semak pratonton dan tandakan pengesahan keputusan rasmi dahulu.');
          return;
        }
        if (!confirm('Terbitkan barisan AJK sesi ' + ajkState.sesi + ' untuk paparan ahli?')) return;
      }

      ajkBusy(true);
      ajkMessage(publish ? 'Sedang menerbitkan barisan AJK...' : 'Sedang menyimpan draf...');
      try {
        const report = await ajkRequest(publish ? 'publishAjk' : 'saveAjkDraft', {
          sesi: ajkState.sesi,
          expectedVersion: ajkState.version,
          members: members,
          confirmed: publish
        });
        ajkState.version = report.record.version;
        if (publish) ajkState.published = report.record;
        document.getElementById('ajkConfirmed').checked = false;
        updateAjkStatus(report.record);
        ajkMessage(publish ? 'Barisan AJK berjaya diterbitkan.' : 'Draf berjaya disimpan.', true);
      } catch (error) {
        ajkMessage(error.message + ' Jika status simpan tidak pasti, muatkan semula sesi dahulu.');
      } finally {
        ajkBusy(false);
      }
    }

    document.getElementById('ajkMembers').addEventListener('input', function() {
      document.getElementById('ajkConfirmed').checked = false;
      previewAjk();
    });

    document.getElementById('pinInput').addEventListener('input', function() {
      ajkState = null;
      ajkSuggestions = {};
      document.getElementById('ajkEditor').hidden = true;
      document.getElementById('ajkMembers').innerHTML = '';
      document.getElementById('ajkPreview').innerHTML = '';
      document.getElementById('ajkMessage').textContent = '';
      document.getElementById('ajkConfirmed').checked = false;
    });
  </script>
</body>
</html>
